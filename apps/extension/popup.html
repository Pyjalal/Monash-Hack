<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CargoLens</title>
  <link rel="stylesheet" href="brand/fonts.css">
  <style>
    :root { color-scheme: light; font-family: "Albert Sans", "Segoe UI", system-ui, sans-serif; }
    body { background: #f7f6f2; color: #16284b; margin: 0; min-width: 300px; }
    main { background: #fffefa; border: 1px solid #e8e6df; border-radius: 14px; margin: 12px; padding: 14px; }
    h1 { font-family: "Fraunces", Georgia, serif; font-size: 16px; margin: 0 0 12px; }
    label { color: #52647d; display: block; font-size: 11px; font-weight: 700; letter-spacing: .05em; margin: 12px 0 5px; text-transform: uppercase; }
    input[type="url"] { border: 1px solid #a4adb9; border-radius: 8px; box-sizing: border-box; color: #16284b; font: inherit; padding: 8px; width: 100%; }
    .row { align-items: center; display: flex; justify-content: space-between; gap: 12px; }
    .status { color: #52647d; font-size: 12px; margin: 12px 0 0; min-height: 18px; }
    .status.ok { color: #35684f; }
    .status.error { color: #963c3c; }
    button { background: #16284b; border: 0; border-radius: 8px; color: #fffefa; cursor: pointer; font: inherit; font-weight: 700; padding: 8px 10px; }
    button.secondary { background: #e8e6df; color: #16284b; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .switch { accent-color: #16284b; height: 18px; width: 18px; }
    :focus-visible { outline: 2px solid #16284b; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .switch, .switch::after { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>CargoLens</h1>
    <div class="row">
      <span>Preview visible inbox rows</span>
      <input class="switch" id="enabled" type="checkbox" aria-label="Enable CargoLens previews">
    </div>
    <label for="api-url">Local API URL</label>
    <input id="api-url" type="url" inputmode="url" autocomplete="off" spellcheck="false" aria-describedby="status">
    <div class="actions">
      <button id="save" type="button">Save</button>
      <button class="secondary" id="health" type="button">Check health</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <button class="secondary" id="open-settings" type="button" style="margin-top:12px;width:100%">Inbox actions &amp; smart filters…</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
