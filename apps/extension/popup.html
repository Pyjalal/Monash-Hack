<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CargoLens</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { background: #f4f0f4; color: #342732; margin: 0; min-width: 300px; }
    main { background: #fdfafd; border: 1px solid #eae1e8; border-radius: 14px; margin: 12px; padding: 14px; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { color: #735e70; display: block; font-size: 11px; font-weight: 700; letter-spacing: .05em; margin: 12px 0 5px; text-transform: uppercase; }
    input[type="url"] { border: 1px solid #cdbdca; border-radius: 8px; box-sizing: border-box; color: #342732; font: inherit; padding: 8px; width: 100%; }
    .row { align-items: center; display: flex; justify-content: space-between; gap: 12px; }
    .status { color: #735e70; font-size: 12px; margin: 12px 0 0; min-height: 18px; }
    .status.ok { color: #35684f; }
    .status.error { color: #754369; }
    button { background: #754369; border: 0; border-radius: 8px; color: #fdfafd; cursor: pointer; font: inherit; font-weight: 700; padding: 8px 10px; }
    button.secondary { background: #eae1e8; color: #342732; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .switch { accent-color: #754369; height: 18px; width: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>CargoLens</h1>
    <div class="row">
      <span>Preview visible inbox rows</span>
      <input class="switch" id="enabled" type="checkbox" aria-label="Enable CargoLens previews">
    </div>
    <label for="api-url">Local API URL</label>
    <input id="api-url" type="url" inputmode="url" autocomplete="off" spellcheck="false" aria-describedby="status">
    <div class="actions">
      <button id="save" type="button">Save</button>
      <button class="secondary" id="health" type="button">Check health</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
