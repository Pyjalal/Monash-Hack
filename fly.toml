app = "cargolens"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_AUTH_REQUIRED = "false"

[env]
  HOST = "0.0.0.0"
  PORT = "3001"
  DATABASE_PATH = "/data/cargolens.sqlite"
  DATASET_ROOT = "/app/training_data/sdoc-hackathon-docker/extracted/data_v2"
  DASHBOARD_DIST = "/app/apps/dashboard/dist"
  AUTO_IMPORT_DATASET = "true"
  SERVE_DASHBOARD = "true"
  GMAIL_AUTOMATION_ENABLED = "false"
  GMAIL_POLL_ENABLED = "false"
  JEV_CONCURRENCY = "2"
  JEV_BATCH_SIZE = "8"
  AUTH_REQUIRED = "false"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "cargolens_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
